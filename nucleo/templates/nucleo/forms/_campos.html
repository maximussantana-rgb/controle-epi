{% if form.non_field_errors %}
<div class="alert alert-error" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
<div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }} <span class="required" aria-hidden="true">*</span></label>
    {{ field }}
    {% if field.errors %}<div class="field-error" role="alert">{{ field.errors|striptags }}</div>{% endif %}
</div>
{% endfor %}
